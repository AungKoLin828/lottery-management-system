<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- =====================================================
         BASIC SEO
    ====================================================== -->
    <meta
      name="description"
      content="Lottery Management System for 2D and 3D lottery results, tickets, and account management."
    />

    <meta name="application-name" content="Lottery" />

    <!-- =====================================================
         THEME
    ====================================================== -->
    <meta name="theme-color" content="#0f172a" />

    <meta name="color-scheme" content="dark" />

    <!-- =====================================================
         ANDROID / PWA
    ====================================================== -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- =====================================================
         IOS / IPHONE / IPAD
    ====================================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="apple-mobile-web-app-title" content="Lottery" />

    <!-- =====================================================
         PWA ICONS
    ====================================================== -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- =====================================================
         PWA MANIFEST
         
         vite-plugin-pwa also handles this during build.
    ====================================================== -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- =====================================================
         TITLE
    ====================================================== -->
    <title>Lottery Management System</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
