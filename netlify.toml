# ============================================================
# PLAYER SUPPORT CONVERSATION API
#
# IMPORTANT:
# These point to TOP-LEVEL Netlify function wrappers:
#
# netlify/functions/support-chat.ts
# netlify/functions/support-conversations.ts
#
# Do not rely on:
# netlify/functions/support/chat.ts
# being directly exposed as a Netlify function.
# ============================================================

[[redirects]]
  from = "/api/support/chat"
  to = "/.netlify/functions/support-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/support/conversations"
  to = "/.netlify/functions/support-conversations"
  status = 200
  force = true


# ============================================================
# ADMIN SUPPORT CONVERSATION API
#
# These are separate from the EXISTING ticket APIs above.
#
# Existing:
#   /api/admin/support/tickets
#
# New conversation system:
#   /api/admin/support
#   /api/admin/support/messages
#   /api/admin/support/reply
#   /api/admin/support/close
# ============================================================

[[redirects]]
  from = "/api/admin/support"
  to = "/.netlify/functions/admin-support"
