[build]
  base = "."
  publish = "frontend/dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev --prefix frontend"
  targetPort = 5173
  port = 8888


# ============================================================
# AUTH API
# ============================================================

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true


# ============================================================
# ADMIN RESULTS API
# ============================================================

[[redirects]]
  from = "/api/admin/results"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/results/*"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true


# ============================================================
# ADMIN LOTTERY NUMBER SETTINGS
# ============================================================

[[redirects]]
  from = "/api/admin/lottery-number-settings"
  to = "/.netlify/functions/admin-lottery-number-settings"
  status = 200
  force = true


# ============================================================
# ADMIN DEPOSITS API
# ============================================================

# Get admin deposit requests
[[redirects]]
  from = "/api/admin-deposits"
  to = "/.netlify/functions/admin-deposits"
  status = 200
  force = true

# Approve admin deposit
[[redirects]]
  from = "/api/admin-deposit-approve"
  to = "/.netlify/functions/admin-deposit-approve"
  status = 200
  force = true

# Reject admin deposit
[[redirects]]
  from = "/api/admin-deposit-reject"
  to = "/.netlify/functions/admin-deposit-reject"
  status = 200
  force = true


# ============================================================
# ADMIN USER BALANCE API
# ============================================================

[[redirects]]
  from = "/api/admin/users/:userId/balance"
  to = "/.netlify/functions/admin-user-balance?userId=:userId"
  status = 200
  force = true

# ============================================================
# ADMIN CUSTOMER SUPPORT
# ============================================================

[[redirects]]
  from = "/api/admin/support/tickets"
  to = "/.netlify/functions/admin-support-tickets"
  status = 200

[[redirects]]
  from = "/api/admin/support/ticket"
  to = "/.netlify/functions/admin-support-ticket"
  status = 200

[[redirects]]
  from = "/api/admin/support/ticket/reply"
  to = "/.netlify/functions/admin-support-ticket-reply"
  status = 200

[[redirects]]
  from = "/api/admin/support/ticket/status"
  to = "/.netlify/functions/admin-support-ticket-status"
  status = 200

[[redirects]]
  from = "/api/admin/support/ticket/priority"
  to = "/.netlify/functions/admin-support-ticket-priority"
  status = 200

# ============================================================
# PLAYER DASHBOARD API
# ============================================================

[[redirects]]
  from = "/api/player/dashboard"
  to = "/.netlify/functions/player-dashboard"
  status = 200
  force = true


# ============================================================
# PLAYER TRANSACTIONS API
# ============================================================

[[redirects]]
  from = "/api/player/transactions"
  to = "/.netlify/functions/player-transactions"
  status = 200
  force = true


# ============================================================
# ADMIN USERS API
# ============================================================

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users/:userId"
  to = "/.netlify/functions/admin-users?userId=:userId"
  status = 200
  force = true


# ============================================================
# RESULTS HISTORY API
# ============================================================

[[redirects]]
  from = "/api/results-history"
  to = "/.netlify/functions/results-history"
  status = 200
  force = true


# ============================================================
# ADMIN HOLIDAYS API
# ============================================================

[[redirects]]
  from = "/api/admin/holidays"
  to = "/.netlify/functions/admin-holidays"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/holidays/*"
  to = "/.netlify/functions/admin-holidays/:splat"
  status = 200
  force = true


# ============================================================
# ADMIN NUMBER RESTRICTIONS API
# ============================================================

[[redirects]]
  from = "/api/admin/number-restrictions"
  to = "/.netlify/functions/admin-number-restrictions"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/number-restrictions/*"
  to = "/.netlify/functions/admin-number-restrictions/:splat"
  status = 200
  force = true


# ============================================================
# ADMIN DRAW SETTINGS API
# ============================================================

[[redirects]]
  from = "/api/admin/draw-settings"
  to = "/.netlify/functions/admin-draw-settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/draw-settings/*"
  to = "/.netlify/functions/admin-draw-settings"
  status = 200
  force = true


# ============================================================
# ADMIN PAYMENT METHODS API
# ============================================================

[[redirects]]
  from = "/api/admin/payment-methods"
  to = "/.netlify/functions/admin-payment-methods"
  status = 200


# ============================================================
# ADMIN WITHDRAWALS API
# ============================================================

# Get all withdrawal requests
[[redirects]]
  from = "/api/admin/withdrawals"
  to = "/.netlify/functions/admin-withdrawals"
  status = 200
  force = true

# Get single withdrawal
#
# Example:
# /api/admin/withdrawals/123
#
[[redirects]]
  from = "/api/admin/withdrawals/:withdrawId"
  to = "/.netlify/functions/admin-withdrawals?withdrawId=:withdrawId"
  status = 200
  force = true

# Approve withdrawal
#
# Example:
# /api/admin/withdrawals/123/approve
#
[[redirects]]
  from = "/api/admin/withdrawals/:withdrawId/approve"
  to = "/.netlify/functions/admin-withdrawals?withdrawId=:withdrawId&action=approve"
  status = 200
  force = true

# Reject withdrawal
#
# Example:
# /api/admin/withdrawals/123/reject
#
[[redirects]]
  from = "/api/admin/withdrawals/:withdrawId/reject"
  to = "/.netlify/functions/admin-withdrawals?withdrawId=:withdrawId&action=reject"
  status = 200
  force = true


# ============================================================
# PLAYER DEPOSIT API
# ============================================================

[[redirects]]
  from = "/api/player/deposit-request"
  to = "/.netlify/functions/player-deposit-request"
  status = 200
  force = true

[[redirects]]
  from = "/api/player/payment-methods"
  to = "/.netlify/functions/player-payment-methods"
  status = 200
  force = true

[[redirects]]
  from = "/api/player/deposit-settings"
  to = "/.netlify/functions/player-deposit-settings"
  status = 200
  force = true
  
[[redirects]]
  from = "/api/ai/support"
  to = "/.netlify/functions/ai-support"
  status = 200

# ============================================================
# REALTIME AUTHENTICATION API
# ============================================================

[[redirects]]
  from = "/api/realtime-token"
  to = "/.netlify/functions/realtime-token"
  status = 200
  force = true


# ============================================================
# REACT SPA FALLBACK
#
# MUST BE LAST
# ============================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200