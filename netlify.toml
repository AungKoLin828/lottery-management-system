[build]
  base = "."
  publish = "frontend/dist"
  command = "npm run build"


[functions]
  directory = "netlify/functions"


[dev]
  command = "npm run dev --prefix frontend"
  targetPort = 5173
  port = 8888


# ============================================================
# AUTH API
# ============================================================

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/results"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/results/*"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true
  
# ============================================================
# ADMIN USER BALANCE API
#
# IMPORTANT:
# This route MUST come before the generic user/:userId route.
# ============================================================

[[redirects]]
  from = "/api/admin/users/:userId/balance"
  to = "/.netlify/functions/admin-user-balance?userId=:userId"
  status = 200
  force = true

# ============================================================
# PLAYER DASHBOARD API
#
# GET /api/player/dashboard
#
# This MUST be before the frontend SPA fallback.
# ============================================================

[[redirects]]
  from = "/api/player/dashboard"
  to = "/.netlify/functions/player-dashboard"
  status = 200
  force = true

# ============================================================
# PLAYER TRANSACTIONS API
# ============================================================

[[redirects]]
  from = "/api/player/transactions"
  to = "/.netlify/functions/player-transactions"
  status = 200
  force = true

# ============================================================
# ADMIN USERS API
# ============================================================

# GET /api/admin/users
# POST /api/admin/users
[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true


# GET /api/admin/users/:userId
# PUT /api/admin/users/:userId
# PATCH /api/admin/users/:userId
[[redirects]]
  from = "/api/admin/users/:userId"
  to = "/.netlify/functions/admin-users?userId=:userId"
  status = 200
  force = true

[[redirects]]
  from = "/api/results-history"
  to = "/.netlify/functions/results-history"
  status = 200
  
# ============================================================
# ADMIN HOLIDAYS API
# ============================================================

[[redirects]]
  from = "/api/admin/holidays"
  to = "/.netlify/functions/admin-holidays"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/holidays/*"
  to = "/.netlify/functions/admin-holidays/:splat"
  status = 200
  force = true


# Other API redirects should be here...


# React SPA fallback MUST be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200