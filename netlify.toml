[build]
  base = "."
  publish = "frontend/dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev --prefix frontend"
  targetPort = 5173
  port = 8888


# ============================================================
# AUTH API
# ============================================================

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true


# ============================================================
# ADMIN RESULTS API
# ============================================================

[[redirects]]
  from = "/api/admin/results"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/results/*"
  to = "/.netlify/functions/admin-results"
  status = 200
  force = true


# ============================================================
# ADMIN LOTTERY NUMBER SETTINGS
